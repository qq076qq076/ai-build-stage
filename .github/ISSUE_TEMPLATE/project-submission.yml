name: 投稿 AI 作品
description: 提交一件使用 AI 製作、可公開檢視的作品
title: "[Project]: "
labels:
  - submission
  - status:pending
body:
  - type: markdown
    attributes:
      value: |
        <!-- schema-version: 2 -->
        感謝投稿！請直接在 Issue 標題的 `[Project]:` 後填寫專案名稱；表單只保留必要資料與少量選填項目。

  - type: textarea
    id: description
    attributes:
      label: 作品介紹
      description: 請用 10–2,000 字簡單說明作品用途或主要功能。
      placeholder: 這件作品可以……
    validations:
      required: true

  - type: input
    id: demo_url
    attributes:
      label: 作品網址
      description: 必須是任何人都能開啟的 HTTPS 網址。
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: 原始碼網址
      description: 選填；如果作品有公開 repository，可貼在這裡。
      placeholder: https://github.com/owner/repository

  - type: dropdown
    id: category
    attributes:
      label: 分類
      description: 選填；未選擇時歸入「其他」。
      options:
        - 其他
        - 網站
        - 行動應用
        - 遊戲
        - 開發工具
        - 創意內容
        - 生產力
        - 教育

  - type: input
    id: tags
    attributes:
      label: 標籤
      description: 選填；以逗號分隔，最多五個。
      placeholder: 筆記, 研究, 自動化

  - type: input
    id: ai_tools
    attributes:
      label: 使用的 AI 工具
      description: 至少一項，以逗號分隔。
      placeholder: Codex, ChatGPT
    validations:
      required: true

  - type: input
    id: creator_name
    attributes:
      label: 創作者名稱
      description: 選填；留白時使用你的 GitHub 帳號名稱。

  - type: input
    id: creator_url
    attributes:
      label: 創作者網址
      description: 選填；留白時使用你的 GitHub profile。
      placeholder: https://github.com/username

  - type: checkboxes
    id: agreements
    attributes:
      label: 投稿確認
      options:
        - label: 我有權提交這些內容，理解 Issue 與互動皆為公開資料，並同意投稿規範。
          required: true
